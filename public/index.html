<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f9fa">
    <title>Gmail Cleaner</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">Inbox maintenance</p>
          <h1>Gmail Cleaner</h1>
        </div>
        <button class="refresh" id="refresh" type="button" aria-label="Refresh dashboard">↻</button>
      </header>

      <section id="summary" class="summary">
        <div class="loading">Loading your inbox…</div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>Clean by sender</h2>
          <span class="muted">Most mail</span>
        </div>
        <div id="senders" class="cards"></div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>Categories</h2>
        </div>
        <div id="categories" class="category-list"></div>
      </section>

      <section class="section">
        <div class="section-heading">
          <h2>Quick wins</h2>
        </div>
        <div id="stats" class="stats"></div>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
